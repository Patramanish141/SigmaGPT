name: SigmaGPT CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Backup .env
        working-directory: .
        run: |
          if [ -f backend/.env ]; then cp backend/.env /tmp/env_backup; fi

      - uses: actions/checkout@v4

      - name: Restore .env
        working-directory: .
        run: |
          if [ -f /tmp/env_backup ]; then cp /tmp/env_backup backend/.env; fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
      - run: pm2 restart backend || pm2 start server.js --name backend   # CHECK entry file

  frontend:
    needs: backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./Frontend           # CHECK casing (Frontend vs frontend)
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Deploy to nginx
        run: sudo cp -r dist/* /var/www/html/     # CHECK dist vs build folder
