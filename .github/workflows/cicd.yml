name: SigmaGPT CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install .env from host
        run: |
          if [ ! -f /etc/sigmagpt/backend.env ]; then
            echo "::error::/etc/sigmagpt/backend.env not found on the runner"
            exit 1
          fi
          cp /etc/sigmagpt/backend.env .env

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev
      - run: npm run build --if-present

      - name: Verify .env
        run: |
          test -s .env || { echo "::error::backend/.env is missing or empty"; exit 1; }
          for key in MONGODB_URI TOKEN_KEY OPENAI_API_KEY; do
            grep -qE "^[[:space:]]*${key}[[:space:]]*=" .env || { echo "::error::${key} missing from backend/.env"; exit 1; }
          done

      - run: sudo pm2 restart backend || sudo pm2 start server.js --name backend

  frontend:
    needs: backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to nginx
        run: sudo cp -r dist/* /var/www/html/
