name: SigmaGPT CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Backup .env
        run: |
          if [ -f .env ]; then mv .env /tmp/env_backup; fi

      - uses: actions/checkout@v4

      - name: Restore .env
        run: |
          if [ -f /tmp/env_backup ]; then mv /tmp/env_backup .env; fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
      - run: sudo pm2 restart backend

  frontend:
    needs: backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build
